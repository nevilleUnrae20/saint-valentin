<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Dress Code et Heure 💘</title>
    <link rel="stylesheet" href="./styles.css">
</head>
<body>
    <div class="container">
        <h1 id="lieu-titre">Notre Rendez-vous</h1>
        
        <div class="dress-code-container">
            <h2>Choisis ton Dress Code 👗👔</h2>
            <div class="dress-code-options">
                <button class="dress-code-btn" data-code="casual">Casual 👖</button>
                <button class="dress-code-btn" data-code="chic">Chic 👗</button>
                <button class="dress-code-btn" data-code="elegant">Élégant 🕴️</button>
                <button class="dress-code-btn" data-code="romantique">Romantique 💕</button>
            </div>

            <h2>Choisis l'Heure 🕰️</h2>
            <div class="heure-container">
                <input type="time" id="heure-rendez-vous" class="heure-input">
            </div>

            <button id="continuer-btn" class="continue-btn">Continuons 💘</button>
        </div>
    </div>

    <script src="./script-dress-code.js"></script>
</body>
</html>
